name: Web client and API contract
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'apps/r-link-web/**', 'R-Link-Server/**', 'docs/repository-consolidation/R-Link-Web/**', 'scripts/verify_web_migration.py', '.github/workflows/web-client.yml']
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'apps/r-link-web/**', 'R-Link-Server/**', 'docs/repository-consolidation/R-Link-Web/**', 'scripts/verify_web_migration.py', '.github/workflows/web-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/r-link-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/r-link-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: R-Link-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_web_migration.py
        working-directory: .
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q

  desktop-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: apps/r-link-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/r-link-web/package-lock.json
      - run: rustup default stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features custom-protocol
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
