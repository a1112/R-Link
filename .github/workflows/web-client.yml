name: Web client and API contract
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'apps/r-link-web/**', 'R-Link-Server/**', 'crates/**', 'contracts/**', 'deploy/**', '.dockerignore', 'scripts/build_nas_package.py', 'docs/repository-consolidation/R-Link-Web/**', 'scripts/verify_web_migration.py', '.github/workflows/web-client.yml']
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'apps/r-link-web/**', 'R-Link-Server/**', 'crates/**', 'contracts/**', 'deploy/**', '.dockerignore', 'scripts/build_nas_package.py', 'docs/repository-consolidation/R-Link-Web/**', 'scripts/verify_web_migration.py', '.github/workflows/web-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/r-link-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/r-link-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: R-Link-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_web_migration.py
        working-directory: .
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q

  desktop-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: apps/r-link-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/r-link-web/package-lock.json
      - run: rustup default stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo test --manifest-path ../../crates/r-link-core/Cargo.toml --locked --target-dir src-tauri/target
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features custom-protocol
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol

  desktop-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: apps/r-link-web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/r-link-web/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Test reusable native Core including Unix credential permissions
        run: cargo test --manifest-path ../../crates/r-link-core/Cargo.toml --locked --target-dir src-tauri/target
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features custom-protocol
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
