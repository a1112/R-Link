[package]
name = "r-link-core"
version = "0.1.0"
edition = "2021"
description = "R-Link native capability adapters, independent of the desktop UI"

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
