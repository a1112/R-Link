# Keep Compose V1 support for DSM 7.1 Docker. rlink.sh fixes the project name.
version: '2.4'
services:
  server:
    image: rlink-nas-server:${R_LINK_IMAGE_TAG:-0.1.0-nas.20261003}
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile.server
      args:
        R_LINK_SOURCE_COMMIT: ${R_LINK_SOURCE_COMMIT:-source-checkout}
    init: true
    restart: unless-stopped
    environment:
      R_LINK_API_TOKEN: ${R_LINK_API_TOKEN:?Run init.sh and preserve the generated .env}
      R_LINK_CORS_ORIGINS: ${R_LINK_CORS_ORIGINS:-http://localhost:8080,tauri://localhost,http://tauri.localhost}
      R_LINK_RFILE_URL: ${R_LINK_RFILE_URL:-http://host.docker.internal:18080}
      R_LINK_RFILE_BRIDGE_URL: ${R_LINK_RFILE_BRIDGE_URL:-http://host.docker.internal:18100}
      R_LINK_RFILE_INTERVAL: ${R_LINK_RFILE_INTERVAL:-30}
      R_LINK_RFILE_ROOT: ${R_LINK_RFILE_ROOT:-}
      R_LINK_RFILE_SESSION_TOKEN: ${R_LINK_RFILE_SESSION_TOKEN:-}
      R_LINK_RFILE_TOKEN: ${R_LINK_RFILE_TOKEN:-}
      R_LINK_RFILE_CA_CERT: ${R_LINK_RFILE_CA_CERT:-}
      R_LINK_AUTH_MODE: ${R_LINK_AUTH_MODE:-local}
      R_LINK_PUBLIC_URL: ${R_LINK_PUBLIC_URL:-}
      R_LINK_OIDC_ISSUER: ${R_LINK_OIDC_ISSUER:-}
      R_LINK_OIDC_CLIENT_ID: ${R_LINK_OIDC_CLIENT_ID:-}
      R_LINK_OIDC_CLIENT_SECRET: ${R_LINK_OIDC_CLIENT_SECRET:-}
      R_LINK_BOOTSTRAP_ADMIN_SUBJECT: ${R_LINK_BOOTSTRAP_ADMIN_SUBJECT:-}
      R_LINK_SESSION_SECONDS: ${R_LINK_SESSION_SECONDS:-28800}
      R_LINK_AUTH_FLOW_SECRET: ${R_LINK_AUTH_FLOW_SECRET:-}
      R_LINK_FABRIC_PUBLIC_URL: ${R_LINK_FABRIC_PUBLIC_URL:-}
      R_LINK_FABRIC_ADDRESS_POOL: ${R_LINK_FABRIC_ADDRESS_POOL:-10.253.199.0/24}
      R_LINK_FABRIC_STUN_SERVERS: ${R_LINK_FABRIC_STUN_SERVERS:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - data:/data
      - config:/app/config
      - plugins:/app/plugins
      - logs:/app/logs
    stop_grace_period: 60s
  web:
    image: rlink-nas-web:${R_LINK_IMAGE_TAG:-0.1.0-nas.20261003}
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile.web
      args:
        R_LINK_SOURCE_COMMIT: ${R_LINK_SOURCE_COMMIT:-source-checkout}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - ${R_LINK_WEB_BIND:-0.0.0.0}:${R_LINK_WEB_PORT:-8080}:80
volumes:
  data:
    name: ${R_LINK_VOLUME_PREFIX:-rlink-nas}-data
  config:
    name: ${R_LINK_VOLUME_PREFIX:-rlink-nas}-config
  plugins:
    name: ${R_LINK_VOLUME_PREFIX:-rlink-nas}-plugins
  logs:
    name: ${R_LINK_VOLUME_PREFIX:-rlink-nas}-logs
