# Optional Linux gateway override. Read docs/device-qos-20261011.md first.
# docker compose -f deploy/compose.yaml -f deploy/compose.qos.yaml up -d --build
services:
  server:
    # Observe the gateway's actual client-facing interface and packet addresses.
    network_mode: host
    ports: !reset []
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      R_LINK_QOS_ENABLED: "true"
      R_LINK_HOST: "127.0.0.1"
  web:
    # The loopback-only API remains accessible to nginx on this Linux host.
    network_mode: host
    ports: !reset []
    volumes:
      - ./nginx.qos.conf:/etc/nginx/conf.d/default.conf:ro
