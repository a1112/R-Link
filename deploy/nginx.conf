# Loaded by nginx's http context. Keep API credentials and SSH upgrade headers.
map $http_upgrade $rlink_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend enforces its own 64 MiB file limit; allow multipart overhead.
    client_max_body_size 70m;

    location /api/ {
        proxy_pass http://server:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rlink_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
